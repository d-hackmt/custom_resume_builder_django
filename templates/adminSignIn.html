{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            color: #1a73e8;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #1a73e8;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 0.5rem;
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1557b0;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #ddd;
            color: #666;
        }

        .footer a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 1rem;
        }

        .forgot-password a {
            color: #1a73e8;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .alert-error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <ul>
        <div class="container">
            <div class="header">
                <h1>Welcome Back</h1>
                <p>Sign in to continue</p>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div class="alert-error">{{ message }}</div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'admin_signin' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required />
                    <!-- changed name to email to match generic signin view reuse logic if applicable, but view uses 'email'. Wait, admin has 'adminEmail' in schema but I reused 'signin' view? No I wrote admin_signin view which returns signin(request). Signin view expects 'email'. So name='email' is correct for my django implementation. -->
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />
                    <!-- matched to core/views.py signin expectation -->
                </div>
                <!-- <div class="forgot-password">
          <a href="#">Forgot password?</a>
        </div> -->
                <button type="submit">Sign In</button>
            </form>
            <!-- Admin signup? Might not exist in my urls but was in original template -->
            <!-- <div class="footer">
        Don't have an account? <a href="admin/adminSignUp">Sign Up</a>
      </div> -->
            <!-- I'll comment out signup link if I don't implement admin signup to avoid 404, or keep it if I did. I didn't verify adminSignUp url logic. I'll leave it as is but careful with URL -->
        </div>
</body>

</html>
